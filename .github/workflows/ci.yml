name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and media-core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and bundle UI
        run: pnpm build
      - name: Test pure Rust media rules
        run: cargo test --manifest-path src-tauri/crates/media-core/Cargo.toml

  rust-linux:
    name: Tauri Rust build and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check and test workspace
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets
